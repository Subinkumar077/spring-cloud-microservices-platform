
# =====================================
# APPLICATION
# =====================================
spring.application.name=API-GATEWAY
server.port=8084

# =====================================
# EUREKA SERVICE DISCOVERY
# =====================================
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# =====================================
# API GATEWAY ROUTES
# =====================================

# USER SERVICE
spring.cloud.gateway.server.webmvc.routes[0].id=USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

# RATING SERVICE
spring.cloud.gateway.server.webmvc.routes[1].id=RATING-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://RATING-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/ratings/**

# HOTEL SERVICE
spring.cloud.gateway.server.webmvc.routes[2].id=HOTEL-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://HOTEL-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/hotels/**

# =====================================
# OKTA OAUTH2 CLIENT
# =====================================
spring.security.oauth2.client.registration.okta.client-id=0oa19xijaqqjSkC4s698
spring.security.oauth2.client.registration.okta.client-secret=${OKTA_CLIENT_SECRET}
spring.security.oauth2.client.registration.okta.client-name=Okta
spring.security.oauth2.client.registration.okta.provider=okta
spring.security.oauth2.client.registration.okta.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.okta.scope=openid,profile,email,offline_access
spring.security.oauth2.client.registration.okta.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# OKTA PROVIDER
spring.security.oauth2.client.provider.okta.issuer-uri=https://integrator-1482572.okta.com/oauth2/default

# =====================================
# JWT RESOURCE SERVER
# =====================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://integrator-1482572.okta.com/oauth2/default
